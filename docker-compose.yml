services:
  app:
    # 평소엔 GHCR의 완성 이미지를 pull해서 쓰고(서버), 직접 굽고 싶을 때만 --build(개발 PC)
    image: ghcr.io/ehdwn009/docvault:latest
    build: .
    ports:
      - '3000:3000'
    volumes:
      # 영속 데이터는 이 폴더 하나. 백업 = 폴더 복사, 이사 = 폴더 이동.
      - ./data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env before running}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin1234}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 외부(폰) 접속용 Cloudflare Tunnel — 선택 사항. 켜려면:
  #   docker compose --profile tunnel up -d
  # 토큰은 Cloudflare Zero Trust 대시보드에서 터널 생성 후 .env에 CLOUDFLARE_TUNNEL_TOKEN으로
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - app

  # 도메인(DuckDNS 무료 서브도메인 포함)으로 직접 HTTPS 서빙 — 선택 사항. 켜려면:
  #   .env에 DOCVAULT_DOMAIN=내이름.duckdns.org 넣고
  #   docker compose --profile edge up -d
  # Caddy가 Let's Encrypt 인증서를 자동 발급·갱신한다 (서버의 80·443 포트가 열려 있어야 함)
  caddy:
    image: caddy:2-alpine
    profiles: [edge]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOCVAULT_DOMAIN=${DOCVAULT_DOMAIN:-}
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
