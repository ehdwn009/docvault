services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      # 영속 데이터는 이 폴더 하나. 백업 = 폴더 복사, 이사 = 폴더 이동.
      - ./data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env before running}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin1234}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 외부(폰) 접속용 Cloudflare Tunnel — 선택 사항. 켜려면:
  #   docker compose --profile tunnel up -d
  # 토큰은 Cloudflare Zero Trust 대시보드에서 터널 생성 후 .env에 CLOUDFLARE_TUNNEL_TOKEN으로
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - app
