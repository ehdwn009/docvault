# CI: main에 push될 때마다 GitHub의 빌드 서버가 Docker 이미지를 구워 GHCR(GitHub 컨테이너 창고)에 올린다.
# 운영 서버(e2-micro)는 빌드하지 않고 완성된 이미지를 pull만 한다 — 저사양 서버에서 30분 걸리던 빌드 제거.
name: build-image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ehdwn009/docvault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
