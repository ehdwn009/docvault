<title>Loft 수출입 정리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 한 단으로 읽는 보고서. 맨 위에 숫자 넷과 결론 셋, 그 아래 주제별로 판단 → 그림·표 순 */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #14181f; --ink-2: #47505e; --muted: #737c8c; --line: #e1e5eb;
  --bar: #2a78d6; --bar-soft: #9ec5f4; --neg: #e34948; --mark: #eef4fd;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1217; --surface: #171b22; --ink: #eceef2; --ink-2: #bcc3ce; --muted: #8b94a4; --line: #2a303a;
  --bar: #3987e5; --bar-soft: #184f95; --neg: #e66767; --mark: #1a2433; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --ink: #eceef2; --ink-2: #bcc3ce; --muted: #8b94a4; --line: #2a303a;
  --bar: #3987e5; --bar-soft: #184f95; --neg: #e66767; --mark: #1a2433; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere;
  padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px }
header p, .lead { color: var(--ink-2) }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance }
h2 { font-size: 21px; line-height: 1.35; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance }
h2 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0 }
section { display: flex; flex-direction: column; gap: 14px }
p { margin: 0 }
.sub { font-size: 13.5px; color: var(--muted); margin: 0 }
strong, b { font-weight: 600 }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0 }
.tile .k { font-size: 13px; color: var(--muted) }
.tile .n { font-size: 22px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums }
.tile .n small { font-size: 13px; font-weight: 500; color: var(--ink-2) }
.tile .d { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums }
.take { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: t }
.take li { counter-increment: t; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px }
.take li::before { content: counter(t); width: 24px; height: 24px; margin-top: 3px; border-radius: 50%; background: var(--mark); color: var(--ink); font-size: 13px; font-weight: 600; display: grid; place-items: center }
ul.pts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px }
.fig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px }
.fig figcaption { font-size: 13.5px; color: var(--ink-2); margin-bottom: 8px }
.cols { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; height: 200px; align-items: end }
.cols.short { height: 150px }
.col { display: grid; grid-template-rows: minmax(0, 1fr) 16px 13px; height: 100%; justify-items: center; min-width: 0 }
.col .plot { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 100%; height: 100%; min-height: 0 }
.col .v.now { color: var(--ink); font-weight: 600 }
.col .v { font-size: 9px; letter-spacing: -0.04em; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 14px }
.col .vin { display: block; font-size: 9.5px; letter-spacing: -0.04em; color: #fff; text-align: center; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap }
.col .bar { width: 82%; max-width: 34px; flex: none; background: var(--bar-soft); border-radius: 4px 4px 0 0; box-shadow: 0 1px 0 var(--line) }
.col .bar.now { background: var(--bar) }
.col .m { font-size: 11px; color: var(--muted); line-height: 16px }
.col .yr { font-size: 10px; color: var(--muted); line-height: 13px; white-space: nowrap }
.hbars { display: flex; flex-direction: column; gap: 7px }
.hrow { display: grid; grid-template-columns: 8.6em minmax(0, 1fr) 4.4em; gap: 8px; align-items: center; font-size: 13.5px }
.hn { color: var(--ink-2); line-height: 1.3 }
.ht { position: relative; height: 16px }
.hb { position: absolute; top: 0; height: 16px }
.hb.pos { background: var(--bar); border-radius: 0 4px 4px 0 }
.hb.neg { background: var(--neg); border-radius: 4px 0 0 4px }
.hz { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted) }
.hv { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink) }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.sw.pos { background: var(--bar) } .sw.neg { background: var(--neg) }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; font-variant-numeric: tabular-nums; white-space: nowrap }
th { font-size: 12.5px; font-weight: 500; color: var(--muted); line-height: 1.35; vertical-align: bottom }
th small { font-weight: 400 }
tr:last-child td { border-bottom: 0 }
th:first-child, td:first-child, td.nm { text-align: left }
td.nm { font-weight: 600 }
td.nm { white-space: normal; min-width: 7.5em }
td.nm .note { display: block; font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--ink-2); margin-top: 2px }
td.wrap { white-space: normal; text-align: left }
td.nm0 { font-weight: 500 }
details { margin-top: 10px }
details > summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); padding: 6px 0 }
details > summary:focus-visible, a:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px }
details .tw { margin-top: 6px }
.term { border-bottom: 1px dotted var(--muted) }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; line-height: 1.6 }
</style>

<main id="report"><p class="sub">불러오는 중…</p></main>
<!--TRADE_DATA-->
<script>
(function () {
  // 수출입 동향 정리본 화면 틀 — 그 달의 내용은 전부 자료(JSON, format 2)에서 온다. 형식은 trade-report 스킬의 references/schema.md.
  // 화면에는 결론과 그림·표만 보인다. 근거(쪽·인용·계산식)는 자료 안에 있고 서버가 대조하지만 여기서는 그리지 않는다 (수출입 동향 설계 4단계)
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var fmt = function (v, d) { return Number(v).toLocaleString("en-US", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };
  // 글 안의 **굵게**만 받는다 — 나머지는 전부 글자로
  var rich = function (s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); };
  var pct = function (v) { return v == null ? "–" : (v > 0 ? "▲" : v < 0 ? "▼" : "") + fmt(Math.abs(v), 1) + "%"; };
  var REGION_NAME = { "EU(27)": "EU", "CIS": "러시아 등 CIS", "ASEAN": "아세안" };
  var SERIES = { exp: ["수출액", "억 달러"], imp: ["수입액", "억 달러"], bal: ["무역수지", "억 달러"], daily: ["하루 평균 수출", "일한 날 하루당, 억 달러"] };

  function monthsChart(D, keys) {
    var months = (D.series && D.series.months) || [];
    return keys.map(function (k, n) {
      var vals = (D.series && D.series[k]) || [];
      var max = Math.max.apply(null, vals.filter(function (v) { return v != null; })) * 1.12 || 1;
      var top = vals.indexOf(Math.max.apply(null, vals));
      var show = {}; [0, top, vals.length - 2, vals.length - 1].forEach(function (i) { show[i] = 1; });
      var cols = vals.map(function (v, i) {
        var raw = String(months[i] || ""), dot = raw.indexOf("."), yr = dot > 0 ? raw.slice(0, dot).replace("’", "'") : "", m = dot > 0 ? raw.slice(dot + 1) : raw;
        var now = i === vals.length - 1;
        return '<div class="col" title="' + esc((yr ? yr + "년 " : "") + m + "월 " + fmt(v, v % 1 ? 1 : 0)) + '"><div class="plot">' +
          (show[i] ? '<span class="v' + (now ? " now" : "") + '">' + fmt(v, v % 1 ? 1 : 0) + "</span>" : "") +
          '<div class="bar' + (now ? " now" : "") + '" style="height:' + (Math.max(0, v) / max * 100).toFixed(1) + '%"></div></div><span class="m">' + esc(m) + '</span><span class="yr">' + esc(yr) + "</span></div>";
      }).join("");
      var name = SERIES[k] || [k, ""];
      return '<figcaption' + (n ? ' style="margin-top:18px"' : "") + "><b>" + esc(name[0]) + "</b> · " + esc(name[1]) + (n ? "" : " · 최근 " + vals.length + "개월") + '</figcaption><div class="cols' + (n ? " short" : "") + '" role="img" aria-label="' + esc(name[0]) + ' 막대 그래프">' + cols + "</div>";
    }).join("") + monthsTable(D);
  }

  // 그래프 아래 접어 둔 표 — 그래프에 안 그린 수입·무역수지까지 같은 달끼리 볼 수 있게
  function monthsTable(D) {
    var months = (D.series && D.series.months) || [], keys = ["exp", "imp", "bal", "daily"].filter(function (k) { return D.series && D.series[k]; });
    if (!keys.length) return "";
    return "<details><summary>표로 보기</summary><div class=\"tw\"><table class=\"num\"><thead><tr><th>월</th>" + keys.map(function (k) { return "<th>" + esc(SERIES[k][0]) + "</th>"; }).join("") + "</tr></thead><tbody>" + months.map(function (m, i) {
      return "<tr><td>" + esc(String(m).replace("’", "'")) + "</td>" + keys.map(function (k) { var v = D.series[k][i]; return "<td>" + (v == null ? "–" : (k === "bal" && v > 0 ? "+" : "") + fmt(v, v % 1 ? 1 : 0)) + "</td>"; }).join("") + "</tr>";
    }).join("") + "</tbody></table></div></details>";
  }

  function contribChart(D, b) {
    var rows = b.items.map(function (n) { var it = (D.items || []).filter(function (x) { return x.name === n; })[0]; return it ? [(b.labels && b.labels[n]) || n, it.increase] : null; }).filter(Boolean);
    var rest = Math.round((b.total - rows.reduce(function (a, r) { return a + r[1]; }, 0)) * 10) / 10;
    var pos = rows.filter(function (r) { return r[1] >= 0; }).sort(function (a, c) { return c[1] - a[1]; });
    var neg = rows.filter(function (r) { return r[1] < 0; }).sort(function (a, c) { return a[1] - c[1]; });
    var all = pos.concat(Math.abs(rest) >= 0.1 ? [["그 밖의 품목 합계", rest]] : [], neg);
    var max = Math.max.apply(null, all.map(function (r) { return Math.abs(r[1]); })) || 1;
    var lowest = Math.max.apply(null, all.map(function (r) { return r[1] < 0 ? -r[1] : 0; }));
    var zero = lowest > 0 ? Math.max(4, lowest / max * 93 + 1) : 0;
    return '<figcaption><b>늘어난 수출 ' + fmt(b.total, 1) + "억 달러는 어디서 왔나</b> · 작년 같은 달보다 늘어난 금액, 억 달러</figcaption><div class=\"hbars\">" + all.map(function (r) {
      var w = Math.abs(r[1]) / max * (100 - zero);
      var bar = r[1] >= 0 ? '<span class="hb pos" style="left:' + zero + "%;width:" + w.toFixed(2) + '%"></span>' : '<span class="hb neg" style="left:' + (zero - w).toFixed(2) + "%;width:" + w.toFixed(2) + '%"></span>';
      return '<div class="hrow"><span class="hn">' + esc(r[0]) + '</span><span class="ht">' + bar + '<span class="hz" style="left:' + zero + '%"></span></span><span class="hv">' + (r[1] >= 0 ? "+" : "−") + fmt(Math.abs(r[1]), 1) + "</span></div>";
    }).join("") + '</div><div class="legend"><span><i class="sw pos"></i>늘어난 금액</span>' + (neg.length ? '<span><i class="sw neg"></i>줄어든 금액</span>' : "") + "</div>";
  }

  function itemsTable(D, b) {
    var M = D.meta, items = D.items || [];
    var head = "<thead><tr><th>품목</th><th>수출액<br><small>억 달러</small></th><th>작년<br>" + esc(M.month) + "보다</th><th>한 달 전<br>(" + esc(M.prevMonth) + ")보다</th></tr></thead>";
    var row = function (it) { return "<tr><td class=\"nm\">" + esc(it.name) + (it.note ? '<span class="note">' + esc(it.note) + "</span>" : "") + "</td><td>" + fmt(it.amt, 1) + "</td><td>" + pct(it.yoy) + "</td><td>" + pct(it.mom) + "</td></tr>"; };
    var top = items.slice(0, b.top || 8), rest = items.slice(b.top || 8);
    return '<div class="tw"><table class="num">' + head + "<tbody>" + top.map(row).join("") + "</tbody></table></div>" +
      (rest.length ? "<details><summary>나머지 " + rest.length + '개 품목</summary><div class="tw"><table class="num">' + head + "<tbody>" + rest.map(row).join("") + "</tbody></table></div></details>" : "");
  }

  function regionsTable(D) {
    var M = D.meta;
    return '<div class="tw"><table class="num"><thead><tr><th>지역</th><th>수출액<br><small>억 달러</small></th><th>작년<br>' + esc(M.month) + "보다</th><th>" + esc(M.month) + "<br>무역수지</th></tr></thead><tbody>" + (D.regions || []).map(function (r) {
      var b = r.balance, bs = b == null ? "–" : (b > 0 ? "+" : b < 0 ? "−" : "") + fmt(Math.abs(b), 0);
      return '<tr><td class="nm">' + esc(REGION_NAME[r.name] || r.name) + (r.note ? '<span class="note">' + esc(r.note) + "</span>" : "") + "</td><td>" + fmt(r.amt, 1) + "</td><td>" + pct(r.yoy) + "</td><td>" + bs + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  }

  function block(D, b) {
    if (b.type === "p") return "<p>" + rich(b.text) + "</p>";
    if (b.type === "sub") return '<p class="sub">' + esc(b.text) + "</p>";
    if (b.type === "bullets") return '<ul class="pts">' + b.items.map(function (it) { return "<li><strong>" + esc(it.lead) + "</strong>: " + rich(it.text) + "</li>"; }).join("") + "</ul>";
    if (b.type === "table") return '<div class="tw"><table class="num cmp"><thead><tr>' + b.columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>" + b.rows.map(function (r) {
      return "<tr>" + r.map(function (c, i) { return "<td" + (i === 0 ? ' class="wrap nm0"' : "") + ">" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
    if (b.type === "months") return '<figure class="fig">' + monthsChart(D, b.series) + "</figure>";
    if (b.type === "contrib") return '<figure class="fig">' + contribChart(D, b) + "</figure>";
    if (b.type === "items") return itemsTable(D, b);
    if (b.type === "regions") return regionsTable(D);
    return "";
  }

  function render(D) {
    var M = D.meta;
    document.title = M.label + " 수출입 정리";
    var html = "<header><h1>" + esc(M.label) + " 수출입 정리</h1><p>산업통상부가 " + esc(M.published || "") + " 발표한 " + esc(M.month) + " 수출입 통계를 흐름 중심으로 다시 정리했습니다. 따로 적지 않으면 증감률은 작년 " + esc(M.month) + "과 비교한 값이고, 금액 단위는 억 달러입니다.</p></header>";
    html += '<section aria-label="핵심 숫자와 결론"><div class="tiles">' + D.tiles.map(function (t) {
      return '<div class="tile"><div class="k">' + esc(t.label) + '</div><div class="n">' + esc(t.value) + "<small>" + esc(t.unit || "") + '</small></div><div class="d">' + (t.lines || []).map(esc).join("<br>") + "</div></div>";
    }).join("") + '</div><ol class="take">' + D.takeaways.map(function (t) { return "<li><span><strong>" + esc(t.lead) + "</strong> " + rich(t.text) + "</span></li>"; }).join("") + "</ol></section>";
    html += D.sections.map(function (s) {
      return "<section><h2><small>" + esc(s.kicker) + "</small>" + esc(s.title) + "</h2>" + s.blocks.map(function (b) { return block(D, b); }).join("") + "</section>";
    }).join("");
    html += "<footer>자료: " + esc(M.sourceTitle || "산업통상부 수출입 동향") + ". " + esc(D.footnote || "") + "</footer>";
    document.getElementById("report").innerHTML = html;
  }

  // 자료는 두 길 — Loft 문서(서버가 이 파일에 JSON을 심어 넣는다, 격리된 뷰어라 fetch가 안 된다)와 단독 페이지(옆의 data.json)
  var inline = document.getElementById("trade-data");
  (inline ? Promise.resolve().then(function () { return JSON.parse(inline.textContent); }) : fetch("data.json").then(function (r) { return r.json(); })).then(render).catch(function (e) {
    document.getElementById("report").innerHTML = '<p class="sub">자료를 불러오지 못했습니다. ' + esc(e && e.message) + "</p>";
  });
})();
</script>
